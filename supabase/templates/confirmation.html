<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Your MD Shift code</title>
</head>
<body style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:#070B17;color:#fff;padding:32px;">
  <div style="max-width:480px;margin:0 auto;">
    <h1 style="font-size:20px;margin:0 0 12px;">MD Shift verification</h1>
    <p style="color:rgba(255,255,255,0.7);line-height:1.5;margin:0 0 20px;">
      Enter this 6-digit code in the MD Shift app or website. Do not share it with anyone.
    </p>
    <p style="font-size:36px;letter-spacing:8px;font-weight:700;margin:0 0 20px;color:#4F8EF7;">
      {{ .Token }}
    </p>
    <p style="color:rgba(255,255,255,0.45);font-size:13px;margin:0;">
      This code expires in about an hour. If you did not create an account, you can ignore this email.
    </p>
  </div>
</body>
</html>
