<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070B17" />
  <meta name="robots" content="noindex" />
  <title>405 — Method not allowed · MD Shift</title>
  <link rel="icon" href="/favicon.svg?v=pulse" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/css/app.css" />
</head>
<body class="error-page">
  <main class="error-card">
    <a class="error-brand" href="/">
      <svg viewBox="0 0 28 28" width="28" height="28" fill="none" aria-hidden="true">
        <rect width="28" height="28" rx="8" fill="#2563eb"/>
        <path d="M5.5 14.5h3.2l2.1-4.6 3.4 9.2 2.2-4.6h6.1"
              stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>MD Shift</span>
    </a>
    <p class="error-code">405</p>
    <h1>Wrong procedure for this route.</h1>
    <p class="error-copy">
      That HTTP method is not credentialed for this endpoint. Think of it as trying to approve a shift with a stethoscope —
      admirable energy, incorrect instrument.
    </p>
    <div class="error-actions">
      <a class="btn-solid" href="/">Back to MD Shift</a>
      <a class="btn-quiet" href="/support/">Page a human</a>
    </div>
    <p class="error-note">Error 405 · Method Not Allowed</p>
  </main>
</body>
</html>
