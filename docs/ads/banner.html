<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MD Shift — Sponsored</title>
  <style>
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .slot {
      display: flex; align-items: center; gap: 12px;
      padding: 12px; min-height: 72px; box-sizing: border-box;
      border-radius: 14px; border: 1px solid #e2e8f0; background: #fff;
      color: #0f172a; text-decoration: none;
    }
    .icon {
      width: 44px; height: 44px; border-radius: 10px; flex: none;
      display: grid; place-items: center; font-weight: 700; font-size: 12px; color: #fff;
    }
    .body { min-width: 0; flex: 1; }
    .tag {
      font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      color: #64748b; background: #f1f5f9; padding: 2px 5px; border-radius: 999px; margin-right: 6px;
    }
    .title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .copy { font-size: 11px; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cta {
      flex: none; font-size: 11px; font-weight: 600; color: #fff;
      padding: 6px 11px; border-radius: 999px;
    }
    .adsbygoogle { display: block; width: 100%; min-height: 72px; }
  </style>
  <script>
    window.ON_CALL_ADS = window.ON_CALL_ADS || {};
  </script>
  <script src="../assets/js/config.js"></script>
</head>
<body>
  <div id="root"></div>
  <script>
    const cfg = window.ON_CALL_CONFIG || {};
    const client = cfg.adsenseClient || "";
    const slot = cfg.adsenseBannerSlot || "";
    const sponsors = [
      { title: "LocumTenens.com", copy: "Fill critical gaps this weekend", cta: "Learn more", tint: "#2563EB", url: "https://www.locumtenens.com/" },
      { title: "MedMal Direct", copy: "Malpractice quotes for call docs", cta: "Get a quote", tint: "#059669", url: "https://www.medmaldirect.com/" },
      { title: "Doximity", copy: "Network with physicians nationwide", cta: "Join free", tint: "#7C3AED", url: "https://www.doximity.com/" },
      { title: "CME List", copy: "Accredited CME that fits call weeks", cta: "Browse CME", tint: "#D97706", url: "https://www.cmelist.com/" },
    ];
    const params = new URLSearchParams(location.search);
    const placement = params.get("placement") || "dashboard";
    const index = [...placement].reduce((s, ch) => s + ch.charCodeAt(0), 0) % sponsors.length;
    const s = sponsors[index];
    const root = document.getElementById("root");

    if (client && slot && client.startsWith("ca-pub-")) {
      const s1 = document.createElement("script");
      s1.async = true;
      s1.src = `https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=${encodeURIComponent(client)}`;
      s1.crossOrigin = "anonymous";
      document.head.appendChild(s1);
      root.innerHTML = `<ins class="adsbygoogle" style="display:block" data-ad-client="${client}" data-ad-slot="${slot}" data-ad-format="horizontal" data-full-width-responsive="true"></ins>`;
      (window.adsbygoogle = window.adsbygoogle || []).push({});
    } else {
      root.innerHTML = `<a class="slot" href="${s.url}" target="_blank" rel="noopener sponsored">
        <div class="icon" style="background:${s.tint}">AD</div>
        <div class="body">
          <div class="title"><span class="tag">Ad</span>${s.title}</div>
          <div class="copy">${s.copy}</div>
        </div>
        <span class="cta" style="background:${s.tint}">${s.cta}</span>
      </a>`;
    }
  </script>
</body>
</html>
