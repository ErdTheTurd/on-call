<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard — On Call</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <script src="assets/js/config.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="./">
        <span class="brand-icon" aria-hidden="true">✦</span>
        <span>On Call</span>
      </a>
      <nav class="nav">
        <span id="user-label" class="muted hide-mobile"></span>
        <a href="#" id="open-app-btn" class="btn btn-secondary">Open app</a>
        <button id="sign-out-btn" class="btn btn-primary" type="button">Sign out</button>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="dashboard-header">
        <div>
          <p class="eyebrow">Web dashboard</p>
          <h1 style="margin: 8px 0 0;">Open shifts</h1>
        </div>
        <p id="status-line" class="muted">Loading…</p>
      </div>

      <div id="shifts" class="shift-grid"></div>
      <p id="empty-state" class="muted hidden">No upcoming shifts yet. Post or accept shifts in the iPhone app.</p>
    </div>
  </main>

  <script type="module">
    import {
      getSupabase,
      isConfigured,
      getSessionUser,
      getUserRole,
      fetchOpenShifts,
      appDeepLink
    } from "./assets/js/supabase-client.js";

    const shiftsEl = document.getElementById("shifts");
    const emptyState = document.getElementById("empty-state");
    const statusLine = document.getElementById("status-line");
    const userLabel = document.getElementById("user-label");
    const openAppBtn = document.getElementById("open-app-btn");
    const signOutBtn = document.getElementById("sign-out-btn");

    openAppBtn.href = appDeepLink("dashboard");

    function formatDate(value) {
      return new Date(value).toLocaleString(undefined, {
        weekday: "short",
        month: "short",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit"
      });
    }

    function renderShift(shift) {
      const card = document.createElement("article");
      card.className = "card shift-card";
      card.innerHTML = `
        <div class="shift-meta">
          <span class="badge">${shift.specialty}</span>
          <span class="badge">${shift.rate_unit || "per_day"}</span>
        </div>
        <h3 style="margin: 0;">${shift.hospital_name}</h3>
        <p class="muted">${formatDate(shift.date)}</p>
        <p><strong>$${Number(shift.rate_floor).toFixed(0)}</strong> floor rate</p>
        <a class="btn btn-secondary" href="${appDeepLink(`shift/${shift.id}`)}">Open in app</a>
      `;
      return card;
    }

    async function boot() {
      if (!isConfigured()) {
        statusLine.textContent = "Configure Supabase in docs/assets/js/config.js.";
        return;
      }

      const user = await getSessionUser();
      if (!user) {
        window.location.href = "auth.html";
        return;
      }

      const role = await getUserRole(user.id);
      userLabel.textContent = `${user.email}${role ? ` · ${role}` : ""}`;

      try {
        const shifts = await fetchOpenShifts();
        shiftsEl.innerHTML = "";
        if (!shifts.length) {
          emptyState.classList.remove("hidden");
          statusLine.textContent = "Synced with Supabase — no open shifts found.";
          return;
        }
        emptyState.classList.add("hidden");
        statusLine.textContent = `${shifts.length} upcoming shift${shifts.length === 1 ? "" : "s"} from Supabase`;
        shifts.forEach((shift) => shiftsEl.appendChild(renderShift(shift)));
      } catch (err) {
        statusLine.textContent = err.message || "Could not load shifts.";
      }
    }

    signOutBtn.addEventListener("click", async () => {
      const supabase = getSupabase();
      await supabase.auth.signOut();
      window.location.href = "auth.html";
    });

    boot();
  </script>
</body>
</html>
